name: Daily Math YouTube Draft

on:
  schedule:
    # Runs once daily at 14:00 UTC (9:00 AM EST / 10:00 AM EDT) to produce & schedule all 4 videos
    - cron: "0 14 * * *"
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

permissions:
  contents: write

concurrency:
  group: mpm2d-publication
  cancel-in-progress: false

jobs:
  generate-and-schedule:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Open persistent publication history
        shell: bash
        run: |
          store="$RUNNER_TEMP/history"
          if git ls-remote --exit-code --heads origin publication-history; then
            git fetch origin refs/heads/publication-history
            git worktree add --detach "$store" FETCH_HEAD
          else
            result=$?
            [[ $result == 2 ]] || exit "$result"
            git worktree add --detach "$store" HEAD
            git -C "$store" switch --orphan publication-history
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg texlive texlive-latex-extra libcairo2-dev libpango1.0-dev

      - name: Install Python dependencies
        run: |
          pip install -q manim edge-tts google-api-python-client google-auth-oauthlib

      - name: Write YouTube OAuth token
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          if [ -z "$YOUTUBE_TOKEN_JSON" ]; then
            echo "Error: YOUTUBE_TOKEN_JSON secret is not set."
            exit 1
          fi
          printf '%s' "$YOUTUBE_TOKEN_JSON" > token.json

      - name: Produce & schedule 4 daily MPM2D videos
        run: |
          mkdir -p output
          python run_pipeline.py \
            --history "$RUNNER_TEMP/history/published_history.json" \
            --sync-history \
            --batch 4 \
            --tz America/Toronto \
            --output-dir output \
            --token token.json

      - name: Upload rendered video artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: math-videos
          path: output/*.mp4
          if-no-files-found: ignore
