name: Daily Math YouTube Draft

on:
  schedule:
    # Runs once daily at 14:00 UTC (9:00 AM EST / 10:00 AM EDT) to produce & schedule all 4 videos
    - cron: "0 14 * * *"
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  generate-and-schedule:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg texlive texlive-latex-extra libcairo2-dev libpango1.0-dev

      - name: Install Python dependencies
        run: |
          pip install -q manim edge-tts google-api-python-client google-auth-oauthlib

      - name: Write YouTube OAuth token
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          if [ -z "$YOUTUBE_TOKEN_JSON" ]; then
            echo "Error: YOUTUBE_TOKEN_JSON secret is not set."
            exit 1
          fi
          printf '%s' "$YOUTUBE_TOKEN_JSON" > token.json

      - name: Produce & schedule 4 daily MPM2D videos
        run: |
          mkdir -p output
          python run_pipeline.py \
            --batch 4 \
            --tz America/Toronto \
            --output-dir output \
            --token token.json

      - name: Upload rendered video artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: math-videos
          path: output/*.mp4
          if-no-files-found: ignore
